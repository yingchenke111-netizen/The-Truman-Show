<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#fafafa;
    --card:#ffffff;
    --text:#18181b;
    --sub:#8b8b8b;
    --border:#e5e7eb;
}
*{ box-sizing:border-box; }
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Serif SC",serif;
}

.header{
    text-align:center;
    padding:70px 20px 40px;
}
.header h1{
    font-weight:500;
    font-size:2.6rem;
    margin-bottom:10px;
}
.subtitle{
    color:var(--sub);
    font-size:.95rem;
}
.back-btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    border-radius:999px;
    text-decoration:none;
    color:var(--text);
    border:1px solid var(--border);
    background:white;
    transition:.35s;
}
.back-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(260px,1fr));
    gap:24px;
}
.gallery-item{
    display:flex;
    flex-direction:column;
}
.gallery-thumb{
    width:100%;
    height:auto;
    max-height:250px;      /* 缩略图最大高度 */
    overflow:hidden;
    border-radius:18px;
    background:#f2f2f2;
    cursor:pointer;
}
.gallery-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:.4s;
}
.gallery-thumb:hover img{
    transform:scale(1.05);
}
.caption{
    margin-top:12px;
    text-align:center;
    color:var(--sub);
    font-size:.88rem;
    line-height:1.7;
}
.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    padding:20px;
}
.lightbox img{
    max-width:92vw;
    max-height:80vh;
    object-fit:contain;
    border-radius:8px;
}
.lightbox-caption{
    margin-top:18px;
    color:#ddd;
    font-size:.95rem;
    text-align:center;
}
.close{
    position:absolute;
    top:25px;
    right:30px;
    color:white;
    font-size:2rem;
    cursor:pointer;
}
.footer-note{
    text-align:center;
    color:#9ca3af;
    font-size:.85rem;
    margin:80px auto 50px;
    line-height:1.8;
    max-width:500px;
    font-style:italic;
}

@media(max-width:768px){
    .header{ padding-top:50px; }
    .header h1{ font-size:2rem; }
    .gallery{
        grid-template-columns: repeat(2,1fr); /* 手机两列 */
        gap:12px;
    }
    .gallery-thumb{ max-height:180px; }
}
</style>
</head>
<body>

<header class="header">
    <h1>图册</h1>
    <div class="subtitle">画＆稿件，时间不分先后，乱排的，我的画只选现在看起来还能看的图。手机端加载会很慢。</div>
    <a href="index.html" class="back-btn">← 返回扉页</a>
</header>

<section class="gallery">
  <!-- 每个图片独立gallery-item -->
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/1.jpg" data-caption=""></div><div class="caption">稿件</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/2a.png" data-caption=""></div><div class="caption">很韩的哦擦酱</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/3.png" data-caption=""></div><div class="caption">akk女神送我的（得意</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/25.png" data-caption=""></div><div class="caption">稿件</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/6.png" data-caption=""></div><div class="caption">港风pa</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/7.png" data-caption=""></div><div class="caption">共犯者？</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/8.gif" data-caption=""></div><div class="caption">六一节</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/9.png" data-caption=""></div><div class="caption">稿件</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/10.png" data-caption=""></div><div class="caption">有模板参考</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/11.png" data-caption=""></div><div class="caption">给产约的第一对丘丘人</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/12.jpg" data-caption=""></div><div class="caption">有参考</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/13.jpg" data-caption=""></div><div class="caption">稿件</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/14.jpg" data-caption=""></div><div class="caption">稿件</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/19.png" data-caption=""></div><div class="caption">居然是和风pa</div></div>
  <div class="gallery-item"><div class="gallery-thumb"><img src="images/23.png" data-caption=""></div><div class="caption">我有港条瘾</div></div>
</section>

<div class="footer-note">
    <p>如果可以恨你 全力痛恨你</p>
<p>連遇上亦要躲避 無非要放下你</p>
<p>還是掛念你 誰又會及我傷悲</p>
<p>前事最怕有人提起 就算怎麼伸盡手臂</p>
<p>我們亦有一些距離</p>
</div>

<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img id="preview">
    <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
const lightbox = document.getElementById('lightbox');
const preview = document.getElementById('preview');
const caption = document.getElementById('lightboxCaption');

document.querySelectorAll('.gallery-thumb img').forEach(img=>{
    img.addEventListener('click',()=>{
        preview.src = img.src;
        caption.textContent = img.dataset.caption || "";
        lightbox.style.display='flex';
    });
});

document.querySelector('.close').addEventListener('click',()=>{
    lightbox.style.display='none';
});

lightbox.addEventListener('click',(e)=>{
    if(e.target===lightbox){
        lightbox.style.display='none';
    }
});
</script>

</body>
</html>
