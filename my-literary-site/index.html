<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC堆放处</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
.corner-gif{

    position:fixed;

    right:20px;

    bottom:20px;

    width:80px;

    opacity:.85;

    pointer-events:none;
}
:root{
    --bg:#fcfcfc;
    --text:#18181b;
    --sub:#71717a;
    --border:#e4e4e7;
}

@media(prefers-color-scheme:dark){
    :root{
        --bg:#09090b;
        --text:#f4f4f5;
        --sub:#a1a1aa;
        --border:#27272a;
    }
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Serif SC",serif;
}


.hero{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

    text-align:center;
}

h1{

    font-size:clamp(3rem,8vw,5rem);

    margin-bottom:12px;

    font-weight:500;
}

.subtitle{

    color:#888;

    margin-bottom:60px;
}

.portal{

    width:100%;

    max-width:900px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:60px;

    flex-wrap:wrap;
}

.portal-card{

    text-decoration:none;

    color:inherit;

    display:flex;

    flex-direction:column;

    align-items:center;

    transition:.35s ease;
}

.portal-card img{

    width:clamp(180px,25vw,320px);

    height:auto;

    object-fit:contain;

    transition:.35s ease;

    filter:drop-shadow(
        0 8px 20px rgba(0,0,0,.08)
    );
}

.portal-card:hover{

    transform:translateY(-10px);
}

.portal-card:hover img{

    transform:scale(1.05);

    filter:drop-shadow(
        0 20px 40px rgba(0,0,0,.15)
    );
}

.portal-card:active{

    transform:scale(.96);
}

.label{

    margin-top:18px;

    font-size:1.3rem;

    letter-spacing:.3em;

    color:#666;
}

@media(max-width:768px){

    .portal{

        flex-direction:column;

        gap:40px;
    }

    .portal-card img{

        width:min(
            70vw,
            260px
        );
    }
}

.star{
    position:fixed;
    color:#000;
    opacity:.18;
    pointer-events:none;
    z-index:1;
}

.s1{
    top:8%;
    left:12%;
    font-size:20px;
    animation:float1 6s ease-in-out infinite;
}

.s2{
    top:18%;
    right:10%;
    font-size:14px;
    animation:float2 8s ease-in-out infinite;
}

.s3{
    top:42%;
    left:6%;
    font-size:18px;
    animation:float3 7s ease-in-out infinite;
}

.s4{
    top:65%;
    right:15%;
    font-size:22px;
    animation:float1 9s ease-in-out infinite;
}

.s5{
    top:80%;
    left:18%;
    font-size:16px;
    animation:float2 6s ease-in-out infinite;
}

.s6{
    top:30%;
    right:30%;
    font-size:12px;
    animation:float3 10s ease-in-out infinite;
}

.s7{
    top:55%;
    left:35%;
    font-size:15px;
    animation:float1 8s ease-in-out infinite;
}

.s8{
    top:88%;
    right:8%;
    font-size:20px;
    animation:float2 7s ease-in-out infinite;
}

@keyframes float1{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }
}

@keyframes float2{

    0%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-8px) rotate(8deg);
    }

    100%{
        transform:translateY(0) rotate(0deg);
    }
}

@keyframes float3{

    0%{
        transform:translateY(0) translateX(0);
    }

    50%{
        transform:translateY(-6px) translateX(4px);
    }

    100%{
        transform:translateY(0) translateX(0);
    }



    
}

</style>
</head>
<body>
<div class="star s1">✦</div>
<div class="star s2">✦</div>
<div class="star s3">✦</div>
<div class="star s4">✦</div>
<div class="star s5">✦</div>
<div class="star s6">✦</div>
<div class="star s7">✦</div>
<div class="star s8">✦</div>

<img
src="assets/3.png"
class="corner-gif"
alt="">

<section class="hero">

    <h1>杂物间</h1>
    <div class="divider">
✦ ✦ ✦
</div>

    <p class="subtitle">
       对了， 说到OC
    </p>

    <div class="portal">

        <a href="article.html" class="portal-card">

            <img
                src="assets/2.png"
                alt="文学">

            
            </div>

        </a>

        <a href="gallery.html" class="portal-card">

            <img
                src="assets/1.png"
                alt="图册">

          
            </div>

        </a>

    </div>
    

</section>


<div class="ending-note">
  <p>如果可以恨你 全力痛恨你</p>
<p>連遇上亦要躲避 無非要放下你</p>
<p>還是掛念你 誰又會及我傷悲</p>
<p>前事最怕有人提起 就算怎麼伸盡手臂</p>
<p>我們亦有一些距離</p>
</div>

</div>

<style>
.ending-note {
    margin: 60px auto 40px;
    text-align: center;
    color: #9ca3af;       /* 浅灰色 */
    font-size: 0.9rem;    /* 不大 */
    line-height: 1.8;
    max-width: 500px;
    font-style: italic;   /* 斜体 */
}
</style>


</body>

</html>
