<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章标题</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #18181b;
      --sub: #71717a;
      --border: #e4e4e7;
      --btn: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --text: #f4f4f5;
        --sub: #a1a1aa;
        --border: #27272a;
        --btn: #18181b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Noto Serif SC", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 2;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .meta {
      color: var(--sub);
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 30px 0;
    }

    article {
      font-size: 1.1rem;
    }

    article p {
      margin-bottom: 1.5em;
    }

    article h2, article h3 {
      margin-top: 2em;
    }

    article img {
      max-width: 100%;
      border-radius: 12px;
      display: block;
      margin: 20px auto;
    }

    article blockquote {
      border-left: 3px solid var(--border);
      padding-left: 18px;
      color: var(--sub);
      margin-left: 0;
    }

    .back-wrap {
      margin-top: 60px;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--border);
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 18px;
      }

      article {
        font-size: 1rem;
      }

      .back-btn {
        width: 100%;
        max-width: 240px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>雨夜随笔</h1>
  <div class="meta">2026-05-24 · 随笔</div>

  <hr>

  <article>

    <p>窗外的雨像一场漫长的独白，敲打着记忆的边缘。</p>

    <p>夜色被雨水一点点浸透，街灯像漂浮在水里的星辰。</p>

    <h2>小标题</h2>

    <p>有些往事像潮湿的纸页，在安静的时候慢慢翻开。</p>

    <blockquote>
      “记忆总在雨夜里变得清晰。”
    </blockquote>

    <p>这里继续写你的长正文……</p>

  </article>

  <!-- 底部返回首页按钮 -->
  <div class="back-wrap">
    <a href="../index.html" class="back-btn">← 返回首页</a>
  </div>

</div>

</body>
</html>
